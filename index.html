<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TOFA Life Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a13;--bg2:#09121f;--card:#0d1727;--card2:#111e33;--line:#1b2a43;--line2:#24395a;
  --accent:#3d9bff;--accent2:#6ab8ff;--accent-dim:#123257;--glow:rgba(61,155,255,.35);
  --text:#eaf1fb;--muted:#8291a9;--muted2:#5d6c84;--green:#2fd16b;--red:#ff4d5e;--orange:#ffb340;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;min-height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#0c1a2e 0%,var(--bg) 60%) fixed;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
svg{display:block}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* ---------- HOME ---------- */
.home{min-height:100vh;display:flex;flex-direction:column;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.hero{position:relative;text-align:center;padding:42px 0 26px}
.hero .mtn{position:absolute;inset:0 -18px auto;height:230px;opacity:.55;pointer-events:none}
.gear{position:absolute;right:0;top:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.gear svg{width:20px;height:20px}
.logo{position:relative;font-size:52px;font-weight:800;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#fff 30%,#a9c8ea);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(61,155,255,.25)}
.logo-sub{position:relative;margin-top:6px;font-size:17px;font-weight:600;letter-spacing:6px;color:var(--accent)}
.hero h1{position:relative;margin-top:26px;font-size:24px;font-weight:700}
.hero p{position:relative;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;aspect-ratio:1/0.92;border-radius:20px;padding:16px 10px 14px;background:linear-gradient(160deg,#122340 0%,#0b1626 70%);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{flex:1;display:grid;place-items:center;color:var(--accent2);filter:drop-shadow(0 0 12px var(--glow))}
.tile .ic svg{width:54px;height:54px}
.tile b{font-size:16px;font-weight:600}
.tile small{color:var(--muted);font-size:11.5px;margin-top:3px}
.tile .badge{position:absolute;top:10px;right:10px;font-size:10.5px;padding:3px 7px;border-radius:20px;background:rgba(255,179,64,.14);color:var(--orange);font-weight:600}
.tile .badge.ok{background:rgba(61,155,255,.14);color:var(--accent2)}
.quote{margin-top:auto;padding-top:30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}

/* ---------- LAYOUT ---------- */
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 10px;background:rgba(5,10,19,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top h2{text-align:center;font-size:18px;font-weight:700}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--text)}
.ib svg{width:22px;height:22px}
.ib.accent{color:var(--accent2)}
.body{padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:rgba(8,14,25,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted2);font-size:10.5px;padding:4px 0}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent)}
.nav button.on svg{filter:drop-shadow(0 0 8px var(--glow))}

/* ---------- COMMON ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#15365f,#0f2747);color:var(--accent2);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.outline{border:1.5px solid var(--accent);color:var(--accent2);background:rgba(61,155,255,.07)}
.btn.primary{background:linear-gradient(180deg,#5aaeff,#3d8ff0);color:#fff;box-shadow:0 8px 24px rgba(61,155,255,.3)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn:active{opacity:.85}
.mb{margin-bottom:14px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{width:50px;height:50px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:28px;background:linear-gradient(160deg,#18294a,#0e1a2d);border:1px solid var(--line)}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{color:var(--muted);font-size:13px}
.meta{color:var(--muted);font-size:13px;white-space:nowrap}
.meta.warn{color:var(--orange)}.meta.bad{color:var(--red)}
.dots{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--muted);flex:none}
.dots svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .e{font-size:38px;margin-bottom:8px}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;background:var(--card2);border:1px solid var(--line2);color:var(--muted);margin-top:4px}
.h3{font-size:15px;font-weight:600;margin:16px 0 10px}

/* search & chips */
.search{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;background:none;border:0;outline:0}
.search input::placeholder{color:var(--muted2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* recipes */
.rec{display:flex;align-items:center;gap:12px;padding:8px;margin-bottom:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.rec .img{width:86px;height:70px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:40px;background:radial-gradient(circle at 40% 35%,#2a3e5e,#101c30)}
.rec .info{display:flex;gap:12px;margin-top:6px;color:var(--muted);font-size:12.5px}
.rec .info span{display:flex;align-items:center;gap:4px}
.rec .info svg{width:14px;height:14px}
.fav{width:36px;height:36px;display:grid;place-items:center;color:#4a5a74}
.fav svg{width:22px;height:22px}
.fav.on{color:#ff5a7a}
.ing{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ing .y{color:var(--green)}.ing .n{color:var(--muted2)}.ing .no{color:var(--orange)}
.ing{gap:12px}.ing>span:last-child{flex:none;text-align:right;max-width:45%}
.ing em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.bdgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bdg{font-size:11px;line-height:1.35;padding:2px 7px;border-radius:7px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.bdg.ok{color:var(--green);background:rgba(47,209,107,.08);border-color:rgba(47,209,107,.28)}
.bdg.warn{color:var(--orange);background:rgba(255,179,64,.08);border-color:rgba(255,179,64,.28)}
.bdg.hot{color:#ff8a5c;background:rgba(255,120,80,.08);border-color:rgba(255,120,80,.3)}
.sumcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(160deg,#15365f,#0d1f3a);border-color:var(--line2)}
.sumcard .se{font-size:28px}
.sumcard small{display:block;color:var(--accent2);font-size:12.5px;margin-top:2px;white-space:normal}
.sumcard>svg{width:18px;height:18px;color:var(--muted);flex:none}
.stp{display:flex;gap:12px;padding:8px 0;font-size:14.5px;line-height:1.5;color:#d6e0ee}
.stp i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.rv-emoji{font-size:64px;text-align:center;padding:4px 0 8px}
.fl textarea{width:100%;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0;resize:vertical;font:inherit;color:var(--text);line-height:1.45}
.fl textarea:focus{border-color:var(--accent)}

/* workouts */
.month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.month b{color:var(--accent2);font-weight:600;font-size:16px}
.month .ib svg{width:18px;height:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px;margin-bottom:6px}
.week .wd{color:var(--muted);font-size:12px;margin-bottom:6px}
.week .d{position:relative;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:16px}
.week .d.on{background:var(--accent);color:#fff;box-shadow:0 0 18px var(--glow)}
.week .d.today:not(.on){color:var(--accent2)}
.week .d i{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.week .d.on i{background:#fff}
.wo-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wo-head .wi{width:32px;height:32px;border-radius:10px;background:rgba(47,209,107,.12);color:var(--green);display:grid;place-items:center}
.wo-head .wi svg{width:18px;height:18px}
.wo-head b{flex:1;font-size:16.5px}
.done{width:26px;height:26px;border-radius:50%;background:var(--green);color:#06210f;display:grid;place-items:center}
.done svg{width:15px;height:15px;stroke-width:3}
.ex{display:grid;grid-template-columns:1fr auto 64px;gap:8px;padding:7px 0;font-size:14px;color:#cfd9e8}
.ex span:nth-child(2){color:var(--muted)}
.ex span:last-child{text-align:right;color:var(--muted)}
.wo-btns{display:flex;gap:8px;margin-top:12px}
.weight-card{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.weight-card small{color:var(--accent2);font-size:12.5px}
.weight-card .kg{font-size:26px;font-weight:700;margin-top:4px}
.weight-card .kg em{font-style:normal;font-size:13px;margin-left:8px;font-weight:500}
.up{color:var(--red)}.down{color:var(--green)}

/* new workout */
.inp{width:100%;padding:13px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);outline:0}
.inp:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.exe{display:grid;grid-template-columns:1fr 78px 72px 30px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exe input{width:100%;padding:9px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);outline:0;font-size:13.5px;text-align:center}
.exe input.nm{text-align:left;background:transparent;border-color:transparent;padding-left:2px}
.exe .sr{display:flex;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 4px}
.exe .sr input{border:0;background:none;padding:9px 0}
.exe .sr span{color:var(--muted);font-size:12px}
.trash{color:var(--red);display:grid;place-items:center}
.trash svg{width:19px;height:19px}

/* weight stats */
.chart-card{padding:10px 6px 4px}
.chart-card svg{width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--muted);font-size:11.5px;display:block;min-height:28px}
.stat b{font-size:22px}
.stat b em{font-style:normal;font-size:12px;color:var(--muted);margin-left:2px;font-weight:500}
.tbl .row{padding:12px 4px}

/* 3d print */
.spool{width:50px;height:50px;border-radius:50%;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.4)}
.spool::after{content:"";position:absolute;inset:16px;border-radius:50%;background:#1a1f28;box-shadow:inset 0 0 0 3px #2a303a}
.low{font-size:10.5px;color:var(--orange);margin-left:6px;font-weight:600}
.thumb{position:relative}.thumb>span{font-size:28px}
.thumb img.ext{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cost{display:inline-block;font-size:12.5px;color:var(--accent2);font-weight:600;margin:4px 0 0 4px}
.row.tap{cursor:pointer}
.dl{width:34px;height:34px;display:grid;place-items:center;color:var(--accent2)}
.dl svg{width:20px;height:20px}


/* sheet */
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.ov{touch-action:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:100%;max-width:480px;max-height:88vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translate(-50%,105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}
.show .ov{opacity:1;pointer-events:auto}
.show .sheet{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:14px}
.fl{display:block;margin-bottom:12px}
.fl span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fl input,.fl select{width:100%;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0;appearance:none;-webkit-appearance:none}
.fl input[type=color]{height:48px;padding:6px}
.fl input:focus,.fl select:focus{border-color:var(--accent)}
.act{display:block;width:100%;text-align:left;padding:15px 14px;border-radius:12px;background:var(--card);margin-bottom:8px;font-weight:500}
.act.danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;background:#1a2a44;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* calculator */
.cf{display:block;margin-bottom:10px}
.cf>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.cgrid .cf{min-width:0}
.cin{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.cin:focus-within{border-color:var(--accent)}
.cin input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;padding:12px 0}
.cin em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap;margin-left:6px}
.card select.inp{appearance:none;-webkit-appearance:none;background:var(--card2)}
.cl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;color:#cfd9e8}
.cl span:last-child{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.cl.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:600}
.price{margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(160deg,#15365f,#0f2747);border:1px solid var(--line2);text-align:center}
.price small{display:block;color:var(--muted);font-size:12px}
.price b{display:block;font-size:30px;font-weight:800;color:var(--accent2);margin:4px 0;text-shadow:0 0 18px var(--glow)}
.cset summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
.cset summary::-webkit-details-marker{display:none}
.cset summary::after{content:' ▾';color:var(--muted)}
.cset[open] summary{margin-bottom:12px}
.hint{color:var(--muted2);font-size:12px;line-height:1.5;margin-top:4px}

/* finance */
.fin-hero{text-align:center;padding:18px 14px}
.fin-hero small{color:var(--muted);font-size:12.5px}
.fin-hero b{display:block;font-size:32px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.fin-sub{color:var(--muted);font-size:13px}
.fbar{display:block;width:100%;text-align:left;padding:8px 0;position:relative}
.fbar+.fbar{border-top:1px solid var(--line)}
.fl1{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.fl1 span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.ftrack{display:block;height:8px;border-radius:4px;background:var(--card2);margin-right:40px;overflow:hidden}
.ftrack i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.fbar small{position:absolute;right:0;bottom:6px;color:var(--muted);font-size:12px}
.fday{font-size:12.5px;color:var(--muted);margin:14px 2px 6px;font-weight:600}
.fops{padding:2px 12px}
.fop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}
.fop+.fop{border-top:1px solid var(--line)}
.fop .fic{width:36px;height:36px;flex:none;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px}
.fop .grow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fop.int{opacity:.55}
.famt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.famt.pos{color:var(--green)}
.famt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.fdebt{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:14px}.fdebt span:last-child{color:var(--muted);text-align:right}
.chipx{display:inline-block;padding:8px 12px;border-radius:12px;background:var(--accent-dim);color:var(--accent2);font-size:13.5px}
.frem{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 14px;color:var(--muted)}
.frem input{width:18px;height:18px;accent-color:var(--accent)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:none;flex-direction:column}
#lb.show{display:flex}
.lbin{flex:1;overflow:auto;display:flex;overscroll-behavior:contain;touch-action:pan-x pan-y}
.lbin img{flex:none;width:100%;height:100%;object-fit:contain;display:block;margin:auto}
.lbin img.z{width:220%;height:auto;max-width:none;object-fit:initial}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:1;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px}

/* ===================== STORAGE & SYNC =====================
   Данные каждого пользователя:
   - на устройстве: localStorage под ключом с его Telegram ID
   - в облаке: Telegram CloudStorage — личное хранилище этого пользователя в этом боте,
     другие пользователи (и разработчик) его не видят.
   Синхронизация: «побеждает последнее изменение» (метка времени S.meta.v). */
const TG_USER = (() => { try { return tg.initDataUnsafe.user || null; } catch (e) { return null; } })();
const OWNER_ID = 0; // ← впиши сюда свой Telegram ID (видно в настройках), чтобы приложение открывалось ТОЛЬКО тебе. 0 = открыто всем, у каждого свои данные
const LOCKED = !!OWNER_ID && (!TG_USER || TG_USER.id !== OWNER_ID);
const CLOUD = !LOCKED && !!(TG_USER && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
const LKEY = `${STORE}:${TG_USER ? TG_USER.id : 'web'}`;
const DATA_KEYS = ['products', 'recipes', 'workouts', 'weights', 'filaments', 'models', 'calc', 'fin', 'shop'];
let canStore = false;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); canStore = true; } catch (e) {}
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { if (!canStore) return true; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

let S = lsGet(LKEY);
let PH = lsGet(LKEY + ':ph') || {}; // фото: id → dataURL
if (!S) { const old = lsGet(STORE); if (old && old.products) { S = old; S.meta = { v: 1 }; try { localStorage.removeItem(STORE); } catch (e) {} } }
if (!S || !S.products) S = seed();
S.meta = S.meta || { v: 0 };
S.calc = Object.assign(CALC_DEF(), S.calc || {});
S.fin = Object.assign(FIN_DEF(), S.fin || {});
S.shop = Object.assign(SHOP_DEF(), S.shop || {});
S.ui = Object.assign(seed().ui, S.ui || {});
S.ui.selDate = today();

const photoSrc = p => !p ? '' : p.startsWith('data:') ? p : (PH[p] || '');
const pic = (o, fb) => { const s = photoSrc(o.photo) || o.img; return s ? `<img src="${esc(s)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" onclick="event.stopPropagation();zoomImg(this)">` : fb; };
const allItems = () => [...S.products, ...S.recipes, ...S.filaments, ...S.models];
const refPhotos = () => new Set(allItems().map(o => o.photo).filter(p => p && !p.startsWith('data:')));
function normalizePhotos() { allItems().forEach(o => { if (o.photo && o.photo.startsWith('data:')) { const id = 'ph' + uid() + uid(); PH[id] = o.photo; o.photo = id; } }); }
function saveLocal() {
  const refs = refPhotos(); Object.keys(PH).forEach(k => { if (!refs.has(k)) delete PH[k]; });
  if (!lsSet(LKEY, S) || !lsSet(LKEY + ':ph', PH)) toast('Память устройства заполнена — удали пару фото');
}
// sync=true — реальное изменение данных (уходит в облако); false — только UI (вкладки и т.п.)
function save(sync = true) { if (sync) { normalizePhotos(); S.meta.v = Date.now(); } saveLocal(); if (sync) schedulePush(); }

let syncState = CLOUD ? 'sync' : 'local', lastSync = 0, cloudKeys = new Set(), pushTimer = null, chain = Promise.resolve(), dirty = false;
const cs = (m, ...a) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), 15000);
  try { tg.CloudStorage[m](...a, (e, v) => { clearTimeout(t); e ? rej(e) : res(v); }); } catch (e) { clearTimeout(t); rej(e); }
});
// Лимит Telegram — 4096 на значение. Русский текст в UTF-8 весит до 3 байт на символ,
// поэтому данные режем по 1300 символов, а фото (base64, только латиница) — по 4000.
const CHUNK = 4000, TCHUNK = 1300;
const split = (s, n = CHUNK) => { const o = []; for (let i = 0; i < s.length; i += n) o.push(s.slice(i, i + n)); return o.length ? o : ['']; };
let lastErr = '', retryN = 0, retryT = null;
async function getMany(keys) { const o = {}; for (let i = 0; i < keys.length; i += 20) Object.assign(o, await cs('getItems', keys.slice(i, i + 20))); return o; }
async function removeMany(keys) { for (let i = 0; i < keys.length; i += 20) { const b = keys.slice(i, i + 20); await cs('removeItems', b); b.forEach(k => cloudKeys.delete(k)); } }
async function put(k, v) { await cs('setItem', k, v); cloudKeys.add(k); }
function syncPill() {
  const m = { local: ['📱', 'Только это устройство'], sync: ['⏳', 'Синхронизация…'], ok: ['☁️', 'Синхронизировано'], err: ['⚠️', 'Нет связи с облаком'] }[syncState];
  return `<button class="syncpill ${syncState}" id="syncpill" onclick="syncInfo()">${m[0]} ${m[1]}</button>`;
}
function setSync(st) { syncState = st; if (st === 'ok') { lastSync = Date.now(); lastErr = ''; retryN = 0; } const el = document.getElementById('syncpill'); if (el) el.outerHTML = syncPill(); }
const queue = fn => (chain = chain.then(fn).catch(e => {
  console.warn('sync', e); lastErr = String((e && (e.message || e)) || 'unknown'); setSync('err');
  // повтор с паузой: 10 с, 30 с, 90 с…
  if (CLOUD && retryN < 5) { clearTimeout(retryT); retryT = setTimeout(() => queue(pull), 10000 * Math.pow(3, retryN++)); }
}));
function syncInfo() {
  const t = lastSync ? new Date(lastSync).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) : '—';
  const st = { local: 'Облако недоступно — данные только на этом устройстве (открой приложение из Telegram).', sync: 'Идёт синхронизация…', ok: 'Всё синхронизировано.', err: 'Не удалось связаться с облаком Telegram. Данные на телефоне в порядке, синхронизация повторится сама.' }[syncState];
  openActions('Синхронизация', CLOUD ? [{ label: 'Повторить сейчас', nosave: 1, fn: () => { retryN = 0; flushPush(); queue(pull); } }] : [],
    `<div class="card mb setinfo"><div>${st}</div><div class="muted">Последняя удачная: ${t} · ячеек в облаке: ${cloudKeys.size} из 1024</div>${lastErr ? `<div class="muted" style="margin-top:6px">Ошибка: <code>${esc(lastErr)}</code></div>` : ''}</div>`);
}
function schedulePush() { if (!CLOUD) return; dirty = true; setSync('sync'); clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; queue(push); }, 700); }

async function push() {
  dirty = false;
  const data = {}; DATA_KEYS.forEach(k => data[k] = S[k]);
  const parts = split(JSON.stringify(data), TCHUNK);
  for (let i = 0; i < parts.length; i++) await put('d_' + i, parts[i]);
  await put('d_meta', JSON.stringify({ n: parts.length, v: S.meta.v }));
  await removeMany([...cloudKeys].filter(k => /^d_\d+$/.test(k) && +k.slice(2) >= parts.length));
  const refs = refPhotos();
  const inCloud = new Set([...cloudKeys].filter(k => /^p_.+_n$/.test(k)).map(k => k.slice(2, -2)));
  for (const id of refs) {
    if (inCloud.has(id) || !PH[id]) continue;
    const pp = split(PH[id]);
    if (cloudKeys.size + pp.length + 1 > 1000) { toast('Облако почти заполнено — новое фото только на этом устройстве'); break; }
    for (let i = 0; i < pp.length; i++) await put(`p_${id}_${i}`, pp[i]);
    await put(`p_${id}_n`, String(pp.length));
  }
  const gone = [...inCloud].filter(id => !refs.has(id));
  if (gone.length) await removeMany([...cloudKeys].filter(k => gone.some(id => k.startsWith(`p_${id}_`))));
  if (!dirty) setSync('ok');
}

async function pull() {
  if (dirty) return;
  setSync('sync');
  cloudKeys = new Set(await cs('getKeys'));
  if (!cloudKeys.has('d_meta')) return push(); // облако пустое — первая загрузка
  const meta = JSON.parse((await getMany(['d_meta'])).d_meta || '{}');
  const cv = meta.v || 0, lv = S.meta.v || 0;
  if (cv > lv) {
    const ks = [...Array(meta.n || 0)].map((_, i) => 'd_' + i), got = await getMany(ks);
    const data = JSON.parse(ks.map(k => got[k] || '').join(''));
    if (dirty) return; // пользователь успел что-то изменить — его версия новее
    DATA_KEYS.forEach(k => { if (data[k] !== undefined && data[k] !== null) S[k] = data[k]; });
    S.calc = Object.assign(CALC_DEF(), S.calc || {});
    S.fin = Object.assign(FIN_DEF(), S.fin || {}); pairCache.key = '';
    S.shop = Object.assign(SHOP_DEF(), S.shop || {});
    S.meta.v = cv; saveLocal(); render();
  } else if (cv < lv) return push();
  const need = [...refPhotos()].filter(id => !PH[id] && cloudKeys.has(`p_${id}_n`));
  if (need.length) {
    const ns = await getMany(need.map(id => `p_${id}_n`));
    for (const id of need) { const n = +ns[`p_${id}_n`] || 0; if (!n) continue; const ks = [...Array(n)].map((_, i) => `p_${id}_${i}`), g = await getMany(ks); PH[id] = ks.map(k => g[k] || '').join(''); }
    saveLocal(); render();
  }
  if ([...refPhotos()].some(id => PH[id] && !cloudKeys.has(`p_${id}_n`))) return push(); // фото, добавленные офлайн
  setSync('ok');
}
function flushPush() { if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; queue(push); } }
if (CLOUD) {
  queue(pull);
  try { tg.onEvent('activated', () => { flushPush(); queue(pull); }); tg.onEvent('deactivated', flushPush); } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushPush(); else queue(pull); });
}
saveLocal();

/* ===================== ROUTER ===================== */
let stack = [{ name: 'home' }];
const cur = () => stack[stack.length - 1];
function go(name, p = {}) { hap(); stack.push({ name, p }); render(); window.scrollTo(0, 0); }
function back() { hap(); if (stack.length > 1) stack.pop(); render(); window.scrollTo(0, 0); }
function navTo(name) { hap(); stack = name === 'home' ? [{ name: 'home' }] : [{ name: 'home' }, { name }]; render(); window.scrollTo(0, 0); }

const NAV = [['home', 'Главная', I.home], ['fridge', 'Холодильник', I.fridge], ['workouts', 'Тренировки', I.dumbbell], ['print', '3D Печать', I.printer], ['finance', 'Финансы', I.wallet]];
const nav = tab => `<nav class="nav">${NAV.map(([k, l, ic]) => `<button class="${k === tab ? 'on' : ''}" onclick="navTo('${k}')">${ic}<span>${l}</span></button>`).join('')}</nav>`;

function render() {
  const c = cur();
  const app = document.getElementById('app');
  if (LOCKED) { app.innerHTML = `<div class="home" style="justify-content:center;align-items:center;text-align:center"><div style="font-size:56px">🔒</div><h2 style="margin:14px 0 6px">Личное приложение</h2><p style="color:var(--muted)">Доступ есть только у владельца.</p></div>`; return; }
  if (c.name === 'home') app.innerHTML = Home();
  else {
    const s = SCREENS[c.name](c.p || {});
    app.innerHTML = `<header class="top"><button class="ib" onclick="back()">${I.back}</button><h2>${s.title}</h2><div>${s.action || ''}</div></header><main class="body">${s.body}</main>${nav(s.tab)}`;
  }
  try { stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

/* ---- Рецепты: подбор по холодильнику ---- */
const nrm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
const stemOf = n => { const w = nrm(n).split(/[^a-zа-я0-9]+/).filter(x => x.length > 1)[0] || ''; return w.length > 5 ? w.slice(0, 5) : w.length > 3 ? w.slice(0, -1) : w; };
const ingObj = x => (x && typeof x === 'object') ? x : { n: String(x), q: '', k: [], base: false };
const keysOf = o => (o.k && o.k.length ? o.k : [stemOf(o.n)]).map(nrm).filter(Boolean);
// совпадение по началу слова: «рис» найдёт «Рис басмати», но не «Ирис»; ключи с ! — исключения («перец» без «чёрный»)
const words = s => ' ' + nrm(s).replace(/[^a-zа-я0-9]+/g, ' ').trim();
function findProd(o) {
  const ks = keysOf(o), yes = ks.filter(k => !k.startsWith('!')), no = ks.filter(k => k.startsWith('!')).map(k => k.slice(1));
  return S.products.find(p => { const w = words(p.name); return yes.some(k => w.includes(' ' + k)) && !no.some(k => w.includes(' ' + k)); }) || null;
}
function matchInfo(r) {
  const ings = (r.ing || []).map(ingObj).filter(o => !o.base), miss = [], hot = new Set(); let have = 0;
  ings.forEach(o => { const p = findProd(o); if (p) { have++; if (daysLeft(p.until) <= 2) hot.add(p.name); } else miss.push(o.n); });
  return { total: ings.length, have, miss, hot: [...hot] };
}
const allRecipes = () => [...S.recipes.map(r => ({ ...r, mine: true })), ...CATALOG.filter(c => !S.recipes.some(r => r.from === c.id))];
const findRecipe = id => S.recipes.find(r => r.id === id) || CATALOG.find(c => c.id === id);
function badges(m) {
  const b = [];
  if (m.hot.length) b.push(`<span class="bdg hot">🔥 истекает: ${esc(m.hot[0].toLowerCase())}</span>`);
  if (m.total) {
    if (!m.miss.length) b.push('<span class="bdg ok">✓ всё есть</span>');
    else if (m.miss.length <= 2) b.push(`<span class="bdg warn">нет: ${esc(m.miss.join(', ').toLowerCase())}</span>`);
    else b.push(`<span class="bdg">есть ${m.have} из ${m.total}</span>`);
  }
  return b.join('');
}
function recipeList() {
  const q = nrm(S.ui.recQ.trim()), c = S.ui.recCat;
  const all = allRecipes().map(r => ({ r, m: matchInfo(r) }));
  let list = all;
  if (q) list = list.filter(({ r }) => nrm(r.name).includes(q) || (r.ing || []).some(i => nrm(ingObj(i).n).includes(q)));
  if (c === 'mine') list = list.filter(x => x.r.mine);
  else if (c === 'fridge') list = list.filter(x => x.m.total && x.m.miss.length <= 2).sort((a, b) => a.m.miss.length - b.m.miss.length || b.m.hot.length - a.m.hot.length || b.m.have - a.m.have);
  else if (c !== 'all') list = list.filter(x => x.r.cat === c);
  let head = '';
  if (c === 'all' && !q) {
    const ready = all.filter(x => x.m.total && !x.m.miss.length).length, almost = all.filter(x => x.m.total && x.m.miss.length && x.m.miss.length <= 2).length;
    head = `<button class="card sumcard mb" onclick="setUI('recCat','fridge')"><span class="se">🧊</span><span class="grow"><b>Что приготовить из холодильника</b><small>${ready ? `Можно прямо сейчас: ${ready}` : 'Целиком пока ничего'}${almost ? ` · не хватает 1–2 продуктов: ${almost}` : ''}</small></span>${I.next}</button>`;
  }
  if (!list.length) return head + `<div class="empty"><div class="e">${c === 'fridge' ? '🧊' : '🍽️'}</div>${c === 'fridge' ? 'Добавь продукты в холодильник — и здесь появятся блюда, которые из них можно приготовить' : c === 'mine' ? 'Сохраняй понравившиеся рецепты сердечком ❤︎ или добавь свой через +' : 'Ничего не найдено'}</div>`;
  return head + list.map(({ r, m }) => `<div class="rec" onclick="recipeView('${r.id}')"><div class="img">${pic(r, esc(r.emoji || '🍽️'))}</div><div class="grow"><b>${esc(r.name)}</b><div class="info"><span>${I.clock}${num(r.time)} мин</span><span>${I.chef}${esc(r.level || '')}</span></div><div class="bdgs">${badges(m)}</div></div>${r.mine && !r.from ? '' : `<button class="fav ${r.mine ? 'on' : ''}" onclick="event.stopPropagation();toggleSaved('${r.id}')">${I.heart}</button>`}</div>`).join('');
}
function refreshRecipes() { const el = document.getElementById('reclist'); if (el) el.innerHTML = recipeList(); }
function toggleSaved(id) {
  const mine = S.recipes.find(r => r.id === id);
  if (mine) { S.recipes = S.recipes.filter(r => r.id !== id); toast('Убрано из моих'); }
  else { const c = CATALOG.find(x => x.id === id); if (!c) return; const copy = JSON.parse(JSON.stringify(c)); delete copy.src; S.recipes.push({ ...copy, id: uid(), from: c.id }); toast('Добавлено в мои ❤︎'); }
  hap('medium'); save(); refreshRecipes();
}
function recipeView(id) {
  const r = findRecipe(id); if (!r) return;
  const mine = S.recipes.includes(r), m = matchInfo(r), src = photoSrc(r.photo);
  const rows = (r.ing || []).map(ingObj).map(o => {
    const p = o.base ? null : findProd(o);
    const st = o.base ? '<span class="n">базовое</span>' : p ? `<span class="y">✓ ${nrm(p.name) !== nrm(o.n) ? esc(p.name) : 'есть'}</span>` : '<span class="no">нет</span>';
    return `<div class="ing"><span>${esc(o.n)}${o.q ? `<em>${esc(o.q)}</em>` : ''}</span>${st}</div>`;

  const btns = mine
    ? `<button class="btn ghost" onclick="closeSheet();recipeForm('${r.id}')">Изменить</button>${r.from ? `<button class="btn ghost" onclick="closeSheet();toggleSaved('${r.id}')">Убрать из моих</button>` : `<button class="btn ghost" style="color:var(--red)" onclick="delItem('recipes','${r.id}')">Удалить</button>`}`
    : `<button class="btn primary" onclick="closeSheet();toggleSaved('${r.id}')">❤︎ В мои рецепты</button>`;
  openSheet(`${src ? `<img class="hero-img" src="${esc(src)}" alt="" onclick="event.stopPropagation();zoomImg(this)">` : `<div class="rv-emoji">${esc(r.emoji || '🍽️')}</div>`}<h3>${esc(r.name)}</h3>
    <div class="rec" style="padding:0;border:0;background:none;margin:0"><div class="info" style="margin:0 0 6px"><span>${I.clock}${num(r.time)} мин</span><span>${I.chef}${esc(r.level || '')}</span>${r.serv ? `<span>🍽 ${r.serv} порц.</span>` : ''}</div></div>
    <div class="bdgs">${badges(m)}</div>
    <div class="h3">Ингредиенты${m.total ? ` · есть ${m.have} из ${m.total}` : ''}</div>${rows}
    ${m.miss.length ? `<button class="btn outline" style="margin-top:12px" onclick="addMissingToShop('${r.id}')">🛒 Недостающее — в покупки (${m.miss.length})</button><button class="btn ghost" style="margin-top:8px" onclick="copyMissing('${r.id}')">📋 Скопировать списком</button>` : ''}
    ${steps}
    <div style="display:flex;gap:8px;margin-top:16px">${btns}</div>`);
}
function copyMissing(id) { const m = matchInfo(findRecipe(id)), t = m.miss.map(x => '• ' + x).join('\n'); hap(); navigator.clipboard?.writeText(t).then(() => toast('Список скопирован'), () => toast(m.miss.join(', '))); }

function recipeForm(id) {

      { key: 'level', label: 'Сложность', type: 'select', options: ['Легко', 'Средне', 'Сложно'] }, { key: 'cat', label: 'Категория', type: 'select', options: ['Завтраки', 'Обеды', 'Ужины', 'Перекусы'] },
      { key: 'ing', label: 'Ингредиенты (через запятую)', ph: 'Яйца, Молоко, Сыр' }, { key: 'steps', label: 'Как готовить (каждый шаг с новой строки)', type: 'textarea' }],

    } });
}

/* ---- Workouts ---- */

  const diff = last && prev ? +(last.kg - prev.kg).toFixed(1) : 0;
  const label = sel === today() ? 'Сегодня' : sel === addDays(today(), 1) ? 'Завтра' : `${WD[(sd.getDay() + 6) % 7]}, ${fmt(sel)}`;

    <div class="month"><button class="ib" onclick="shiftWeek(-7)">${I.back}</button><b>${MONTHS[mid.getMonth()]} ${mid.getFullYear()}</b><button class="ib" onclick="shiftWeek(7)">${I.next}</button></div>
    <div class="week">${WD.map(d => `<div class="wd">${d}</div>`).join('')}
      ${days.map(d => `<button class="d ${d === sel ? 'on' : ''} ${d === today() ? 'today' : ''}" onclick="setUI('selDate','${d}')">${toD(d).getDate()}${S.workouts.some(w => w.date === d) ? '<i></i>' : ''}</button>`).join('')}</div>
    <div class="h3">${label}</div>
    ${wos.length ? wos.map(w => `<div class="card mb"><div class="wo-head"><div class="wi">${I.dumbbell}</div><b>${esc(w.title)}</b>${w.done ? `<span class="done">${I.check}</span>` : ''}<button class="dots" onclick="workoutMenu('${w.id}')">${I.dots}</button></div>
      ${w.ex.map(e => `<div class="ex"><span>${esc(e.name)}</span><span>${e.sets}×${esc(e.reps)}</span><span>${e.w ? esc(e.w) + ' кг' : ''}</span></div>`).join('')}
      <div class="wo-btns"><button class="btn ${w.done ? 'ghost' : 'outline'}" onclick="toggleDone('${w.id}')">${w.done ? 'Выполнено ✓' : 'Завершить тренировку'}</button></div></div>`).join('')
      : `<div class="card empty"><div class="e">🏖️</div>День отдыха<br><br><button class="btn outline" onclick="go('newWorkout',{date:'${sel}'})">${I.plus}Запланировать тренировку</button></div>`}
    <div class="card weight-card" onclick="go('weights')"><div><small>Мой вес</small><div class="kg">${last ? last.kg : '—'} кг${diff ? `<em class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${diff} кг</em>` : ''}</div></div>${spark(ws)}</div>` };
};
function shiftWeek(n) { hap(); S.ui.selDate = addDays(S.ui.selDate, n); render(); }
function toggleDone(id) { const w = S.workouts.find(x => x.id === id); w.done = !w.done; hap(w.done ? 'heavy' : 'light'); if (w.done) toast('Красава! 💪'); save(); render(); }
function workoutMenu(id) {
  const w = S.workouts.find(x => x.id === id);
  openActions(w.title, [{ label: 'Изменить', fn: () => go('newWorkout', { id }), keep: 1 }, { label: 'Повторить через неделю', fn: () => { S.workouts.push({ ...JSON.parse(JSON.stringify(w)), id: uid(), date: addDays(w.date, 7), done: false }); toast('Добавлено на ' + fmt(addDays(w.date, 7))); } },
    { label: 'Удалить', danger: 1, fn: () => { S.workouts = S.workouts.filter(x => x.id !== id); toast('Удалено'); } }]);
}
function spark(ws) {
  const p = ws.slice(-10); if (p.length < 2) return '';
  const W = 130, H = 40, k = p.map(x => +x.kg), mn = Math.min(...k), mx = Math.max(...k), r = mx - mn || 1;
  const pts = p.map((x, i) => `${(i / (p.length - 1)) * W},${H - 4 - ((x.kg - mn) / r) * (H - 8)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px var(--glow))"/></svg>`;
}

function chart(ws) {
  if (!ws.length) return '<div class="empty">Добавь первый вес</div>';
  const w = 340, h = 200, L = 30, R = 14, T = 16, B = 26, Wd = w - L - R, Hd = h - T - B;
  const ks = ws.map(x => +x.kg);
  let mn = Math.floor((Math.min(...ks) - 2) / 5) * 5, mx = Math.ceil((Math.max(...ks) + 2) / 5) * 5;
  const t0 = toD(ws[0].date).getTime(), t1 = toD(ws.at(-1).date).getTime(), span = Math.max(t1 - t0, 1);
  const X = p => L + (ws.length === 1 ? Wd / 2 : (toD(p.date) - t0) / span * Wd), Y = k => T + (mx - k) / (mx - mn) * Hd;
  let g = '';
  const steps = (mx - mn) / 5 > 5 ? 10 : 5;
  for (let v = mn; v <= mx; v += steps) g += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1b2a43" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" fill="#5d6c84" font-size="10" text-anchor="end">${v}</text>`;
  const md = new Date(t0); md.setDate(1); md.setMonth(md.getMonth() + 1); let xl = '', n = 0;
  while (md.getTime() <= t1 && n < 8) { const x = L + (md - t0) / span * Wd; xl += `<text x="${x}" y="${h - 6}" fill="#5d6c84" font-size="10" text-anchor="middle">${MSHORT[md.getMonth()]}</text>`; md.setMonth(md.getMonth() + 1); n++; }
  const pts = ws.map(p => `${X(p)},${Y(p.kg)}`);
  const last = ws.at(-1), lx = X(last), ly = Y(last.kg), bx = Math.min(Math.max(lx - 44, L), w - R - 88);
  return `<svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9bff" stop-opacity=".28"/><stop offset="1" stop-color="#3d9bff" stop-opacity="0"/></linearGradient></defs>
    ${g}${xl}<line x1="${L}" x2="${L}" y1="${T}" y2="${h - B}" stroke="#24395a"/>
    ${ws.length > 1 ? `<path d="M${pts[0]} L${pts.join(' L')} L${X(last)},${h - B} L${X(ws[0])},${h - B}Z" fill="url(#ag)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#3d9bff" stroke-width="2.2" stroke-linejoin="round"/>` : ''}
    ${ws.map(p => `<circle cx="${X(p)}" cy="${Y(p.kg)}" r="3" fill="#6ab8ff"/>`).join('')}
    <circle cx="${lx}" cy="${ly}" r="6" fill="#3d9bff" stroke="#050a13" stroke-width="2" style="filter:drop-shadow(0 0 6px #3d9bff)"/>
    <g transform="translate(${bx},${Math.max(ly - 50, 2)})"><rect width="88" height="38" rx="8" fill="#13203a" stroke="#24395a"/><text x="44" y="17" fill="#eaf1fb" font-size="13" font-weight="700" text-anchor="middle">${last.kg} кг</text><text x="44" y="31" fill="#8291a9" font-size="9.5" text-anchor="middle">${fmt(last.date)}</text></g></svg>`;
}

/* ---- Цена и фото по ссылке ----
   Браузер не может напрямую читать чужие сайты, поэтому страница загружается
   через маленький прокси (Cloudflare Worker, код в worker.js). Адрес — META_PROXY. */
let META_PROXY = 'https://tofa-hub.mc0andre0tofan.workers.dev/'; // Cloudflare Worker (worker.js)
async function linkFetch(btn, mode) {
  const box = btn.closest('.fl'), url = box.querySelector('input[type=url]').value.trim();
  if (!/^https?:\/\//.test(url)) return toast('Вставь ссылку, начинающуюся с https://');
  if (!META_PROXY) return toast('Автоподтягивание ещё не подключено — цену и фото пока впиши вручную');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '⏳ Ищу…';
  try {
    const r = await fetch(META_PROXY + '?url=' + encodeURIComponent(url)), m = await r.json();
    if (!r.ok || m.error) throw new Error(m.error || r.status);
    const F = document.getElementById('fform'), set = (n, v) => { const el = F.querySelector(`[name="${n}"]`); if (el && v !== undefined && v !== null && v !== '') el.value = v; };
    if (m.title && !F.querySelector('[name="name"]').value) set('name', m.title.slice(0, 80));
    const kg = (() => { const t = (m.title || '') + ' ' + url, a = t.match(/(\d+(?:[.,]\d+)?)\s*kg/i), b = t.match(/\b(250|500|750|1000|2000|3000)\s*g\b/i); return a ? pAmt(a[1]) : b ? +b[1] / 1000 : 0; })();
    if (kg) set('kg', kg);
    let note = '';
    if (m.price) {
      const cur = (m.currency || 'HUF').toUpperCase(), rate = cur === 'HUF' ? 1 : num(S.fin.rates[cur]) || ({ EUR: 390, USD: 360, GBP: 430 })[cur] || 0;
      if (rate) {
        const huf = Math.round(m.price * rate), perKg = Math.round(huf / (kg || num(F.querySelector('[name="kg"]')?.value) || 1));
        set('price', mode === 'kg' ? perKg : huf);
        note = cur === 'HUF' ? `Цена: ${ft(huf)}` : `Цена: ${m.price} ${cur} ≈ ${ft(huf)}`;
      } else note = `Цена ${m.price} ${cur} — курс неизвестен, впиши в Ft`;
    } else note = 'Цену на странице не нашёл — впиши вручную';
    if (m.image) { set('img', m.image); const im = document.getElementById('lnkimg'); im.src = m.image; im.hidden = false; }
    toast(note); hap('medium');
  } catch (e) { toast('Не удалось открыть страницу магазина — впиши вручную'); }
  btn.disabled = false; btn.textContent = old;
}

/* ---- Калькулятор стоимости печати ---- */
const money = n => (Math.round(n * 100) / 100).toLocaleString('ru', { maximumFractionDigits: S.calc.cur === 'Ft' ? 0 : 2 }) + ' ' + S.calc.cur;
function calcRes(o) {
  const c = S.calc, src = o || c, hours = num(src.h) + num(src.m) / 60;
  const mat = num(src.grams) / 1000 * num(c.price);        // пластик
  const el = num(c.watt) / 1000 * hours * num(c.kwh);    // электричество
  const wear = hours * num(c.wear);                      // износ принтера
  const extra = num(c.extra);                            // постобработка, упаковка
  const fail = (mat + el + wear) * num(c.fail) / 100;    // запас на брак
  const cost = mat + el + wear + extra + fail;
  const profit = cost * num(c.markup) / 100;             // наценка на всю себестоимость
  return { mat, el, wear, extra, fail, cost, profit, price: cost + profit };
}
function calcResHtml(o) {
  const r = calcRes(o), c = S.calc, g = num((o || c).grams), line = (l, v) => `<div class="cl"><span>${l}</span><span>${money(v)}</span></div>`;
  return `${line('Пластик', r.mat)}${line('Электричество', r.el)}${line('Износ принтера', r.wear)}${r.extra ? line('Доп. расходы', r.extra) : ''}${num(c.fail) ? line(`Запас на брак ${num(c.fail)}%`, r.fail) : ''}
    <div class="cl tot"><span>Себестоимость</span><span>${money(r.cost)}</span></div>
    ${num(c.markup) ? line(`Наценка ${num(c.markup)}%`, r.profit) : ''}
    <div class="price"><small>${num(c.markup) ? 'Цена для клиента' : 'Итого'}</small><b>${money(r.price)}</b><small>${g ? money(r.price / g) + ' за грамм' : ''}</small></div>`;
}
function calcBody() {

    <div class="cgrid">${inp('price', 'Цена катушки', c.cur + '/кг')}${inp('grams', 'Вес модели', 'г')}${inp('h', 'Время печати', 'ч', 'numeric')}${inp('m', '&nbsp;', 'мин', 'numeric')}</div>
  </div>
  <div class="card mb" id="calcres">${calcResHtml()}</div>
  ${fil ? `<button class="btn outline mb" id="dedbtn" onclick="calcDeduct()">Напечатал — списать ${num(c.grams)} г с «${esc(fil.name)}»</button>` : ''}

    <div class="cgrid">${inp('watt', 'Мощность принтера', 'Вт', 'numeric')}${inp('kwh', 'Электричество', c.cur + '/кВт·ч')}${inp('wear', 'Износ принтера', c.cur + '/ч')}${inp('fail', 'Запас на брак', '%', 'numeric')}${inp('extra', 'Доп. расходы', c.cur)}${inp('markup', 'Наценка', '%', 'numeric')}</div>
    <label class="cf"><span>Валюта</span><select class="inp" onchange="S.calc.cur=this.value;save();render()">${['Ft', '€', '$', '₴', 'zł'].map(x => `<option ${x === c.cur ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <p class="hint">Мощность — средняя за печать (обычно 100–200 Вт, со столом на ABS больше). Электричество — посмотри в своём счёте. Износ — сопла, ремни, стол и сам принтер: примерно цена принтера ÷ 5000 часов. Параметры сохраняются и синхронизируются.</p>

function calcSet(k, v) {

const fnorm = s => ' ' + String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ё/g, 'е').replace(/[^a-zа-я0-9&]+/g, ' ').trim() + ' ';

function pairs() {

function fcls(t) {
  const n = fnorm(t.s), P = pairs();

  if (t.ig !== 'exp') {

    else if (P.has(t.id)) { kind = 'int'; why = 'Перевод между своими счетами — найдена пара в другом банке'; }
    else if (t.y === 'fx') { kind = 'int'; why = 'Обмен валюты внутри счёта'; }
    else if (t.y === 'topup') { kind = 'int'; why = 'Пополнение со своей карты'; }
    else if (t.y === 'transfer' && /^ revolut /.test(n)) { kind = 'int'; why = 'Перевод внутри Revolut (между своими счетами)'; check = true; }
    else if (t.b !== 'rev' && t.a < 0 && fhas(n, 'revolut')) { kind = 'int'; why = 'Похоже на пополнение Revolut — пара пока не найдена'; check = true; }

  if (!cat) { const r = S.fin.rules.find(r => n.includes(r.m)); if (r) cat = r.cat; }

/* ---- Импорт ---- */
function parseCSV(text) {

  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }

const pAmt = s => { s = String(s || '').replace(/[\s ]/g, ''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); const v = parseFloat(s); return isNaN(v) ? 0 : v; };

const hcol = (H, names) => { for (const n of names) if (n in H) return H[n]; return -1; };

const PARSERS = [{
  bank: 'rev',
  test: h => (h.includes('Тип') && h.includes('Дата начала')) || (h.includes('Type') && h.includes('Started Date')),
  parse(rows) {
    const H = {}; rows[0].forEach((h, i) => H[h.trim()] = i);
    const C = { y: hcol(H, ['Тип', 'Type']), d: hcol(H, ['Дата начала', 'Started Date']), s: hcol(H, ['Описание', 'Description']), a: hcol(H, ['Сумма', 'Amount']),
      f: hcol(H, ['Комиссия', 'Fee']), c: hcol(H, ['Валюта', 'Currency']), st: hcol(H, ['State', 'Состояние', 'Статус']) };
    const TY = { 'платеж по карте': 'card', 'card_payment': 'card', 'пополнение': 'topup', 'topup': 'topup', 'переводы': 'transfer', 'перевод': 'transfer', 'transfer': 'transfer',
      'обмен валюты': 'fx', 'exchange': 'fx', 'возврат на карту': 'refund', 'card_refund': 'refund', 'refund': 'refund' };

  const file = inp.files && inp.files[0]; inp.value = ''; if (!file) return;

    ${learned.length ? `<div class="cl"><span>Курс по обменам в выписке</span><span>${[...new Set(learned.map(l => l[1]))].map(c => `1 ${c} = ${S.fin.rates[c]} Ft`).join(', ')}</span></div>` : ''}
    <p class="hint" style="margin-top:10px">${months.length ? `Период: ${fmon(months[0])} — ${fmon(months.at(-1))}. ` : ''}Файл обработан на телефоне и никуда не отправлялся.</p>
    <button class="btn primary" style="margin-top:12px" onclick="closeSheet()">Смотреть</button>`);
}

/* ---- Экран ---- */
function finMonthData(ym) {
  const rows = S.fin.tx.filter(t => t.d.startsWith(ym)).map(t => ({ t, k: fcls(t), v: hufOf(t) }));
  const exp = rows.filter(r => r.k.kind === 'exp'), inc = rows.filter(r => r.k.kind === 'inc');
  const by = {}; exp.forEach(r => by[r.k.cat] = (by[r.k.cat] || 0) - r.v);
  const debt = rows.filter(r => r.k.kind === 'debt');
  return { rows, spent: exp.reduce((s, r) => s - r.v, 0), earned: inc.reduce((s, r) => s + r.v, 0), by,
    gave: debt.filter(r => r.v < 0).reduce((s, r) => s - r.v, 0), got: debt.filter(r => r.v > 0).reduce((s, r) => s + r.v, 0) };
}
SCREENS.finance = () => {
  const action = `<button class="ib accent" onclick="document.getElementById('finfile').click()">${I.plus}</button>`;
  const inputEl = `<input type="file" id="finfile" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" onchange="finFile(this)">`;
  if (!S.fin.tx.length) return { title: 'Финансы', tab: 'finance', action, body: inputEl + `<div class="card empty" style="padding:28px 16px"><div class="e">💳</div><b style="color:var(--text);font-size:16px">Загрузи выписку из банка</b>
    <p style="margin:10px 0 16px;line-height:1.5">Revolut → счёт → … → <b>Выписка</b> → формат <b>CSV</b>.<br>Приложение само разложит траты по категориям и уберёт переводы между твоими счетами.</p>
    <button class="btn primary" onclick="document.getElementById('finfile').click()">Выбрать файл</button>
    <p class="hint" style="margin-top:12px">🔒 Файл обрабатывается на телефоне и никуда не отправляется.</p></div>` };
  const months = [...new Set(S.fin.tx.map(t => t.d.slice(0, 7)))].sort();
  let ym = S.ui.finMonth; if (!ym || !months.includes(ym)) ym = S.ui.finMonth = months.at(-1);
  const cur = finMonthData(ym), prev = finMonthData(shiftMon(ym, -1)), tab = S.ui.finTab || 'sum';
  const i0 = months.indexOf(ym);
  const head = `<div class="month"><button class="ib" ${i0 > 0 ? `onclick="setUI('finMonth','${months[i0 - 1]}')"` : 'disabled style="opacity:.3"'}>${I.back}</button><b>${fmon(ym)}</b><button class="ib" ${i0 < months.length - 1 ? `onclick="setUI('finMonth','${months[i0 + 1]}')"` : 'disabled style="opacity:.3"'}>${I.next}</button></div>`;
  const seg = `<div class="seg"><button class="${tab === 'sum' ? 'on' : ''}" onclick="S.ui.finCat='';setUI('finTab','sum')">Обзор</button><button class="${tab === 'ops' ? 'on' : ''}" onclick="setUI('finTab','ops')">Операции</button></div>`;
  let body = '';
  if (tab === 'sum') {
    const diff = prev.spent ? Math.round((cur.spent - prev.spent) / prev.spent * 100) : null;
    const cats = Object.entries(cur.by).filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]), max = cats.length ? cats[0][1] : 1;
    body = `<div class="card mb fin-hero"><small>Расходы за месяц</small><b>${ft(cur.spent)}</b>
        <div class="fin-sub">${diff !== null ? `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}%</span> к прошлому месяцу · ` : ''}доходы ${ft(cur.earned)}</div></div>
      <div class="card mb">${cats.length ? cats.map(([c, v]) => `<button class="fbar" onclick="S.ui.finCat='${c}';setUI('finTab','ops')">
          <span class="fl1"><span>${FCATS[c][0]} ${FCATS[c][1]}</span><span>${ft(v)}</span></span>
          <span class="ftrack"><i style="width:${Math.max(2, v / max * 100)}%"></i></span><small>${Math.round(v / cur.spent * 100)}%</small></button>`).join('')
        : '<div class="empty">Трат в этом месяце нет</div>'}</div>
      ${cur.gave || cur.got ? `<button class="card mb fdebt" onclick="S.ui.finCat='debt';setUI('finTab','ops')"><span>🤝 Долги и займы</span><span>${cur.gave ? `отдал ${ft(cur.gave)}` : ''}${cur.gave && cur.got ? ' · ' : ''}${cur.got ? `получил ${ft(cur.got)}` : ''}</span></button>` : ''}
      <p class="hint">🔁 Пополнения со своей карты, обмены валют и переводы между своими счетами в расходы не входят, долги и займы — тоже. Нажми на категорию, чтобы увидеть операции.</p>`;
  } else {
    const fc = S.ui.finCat;
    const rows = cur.rows.filter(r => !fc || (r.k.cat === fc && (r.k.kind === 'exp' || r.k.kind === 'debt')));
    const days = {}; rows.forEach(r => (days[r.t.d.slice(0, 10)] = days[r.t.d.slice(0, 10)] || []).push(r));
    body = `${fc ? `<button class="chipx mb" onclick="setUI('finCat','')">${FCATS[fc][0]} ${FCATS[fc][1]}${fc === 'debt' ? '' : ' · ' + ft(cur.by[fc] || 0)} ✕</button>` : ''}
      ${Object.keys(days).sort().reverse().map(d => `<div class="fday">${WD[(toD(d).getDay() + 6) % 7]}, ${fmt(d)}</div><div class="card fops">${days[d].map(({ t, k, v }) => `<button class="fop ${k.kind === 'int' ? 'int' : ''}" onclick="finOp('${t.id}')">
          <span class="fic">${k.kind === 'int' ? '🔁' : FCATS[k.cat][0]}</span>
          <span class="grow"><b>${esc(t.s)}</b><small>${k.kind === 'int' ? 'не учитывается' + (k.check ? ' · проверь' : '') : k.kind === 'debt' ? 'долг · не в расходах' : FCATS[k.cat][1]} · ${BANKS[t.b] || t.b} · ${t.d.slice(11, 16)}</small></span>
          <span class="famt ${v > 0 ? 'pos' : ''}">${v > 0 ? '+' : ''}${ft(v)}${t.c !== 'HUF' ? `<small>${t.a > 0 ? '+' : '−'}${Math.abs(t.a).toFixed(2)} ${t.c}</small>` : ''}</span></button>`).join('')}</div>`).join('') || '<div class="empty">Нет операций</div>'}`;
  }
  return { title: 'Финансы', tab: 'finance', action, body: inputEl + head + seg + body + `<button class="btn ghost" style="margin-top:16px" onclick="finSettings()">⚙️ Курсы, правила, данные</button>` };
};
function finOp(id) {
  const t = S.fin.tx.find(x => x.id === id); if (!t) return;
  const k = fcls(t), v = hufOf(t);
  openSheet(`<h3>${esc(t.s)}</h3>
    <div class="cl"><span>Сумма</span><span>${t.a > 0 ? '+' : '−'}${Math.abs(t.a).toLocaleString('ru')} ${t.c}${t.c !== 'HUF' ? ` ≈ ${ft(v)}` : ''}</span></div>
    ${t.f ? `<div class="cl"><span>Комиссия</span><span>${t.f} ${t.c}</span></div>` : ''}
    <div class="cl"><span>Дата</span><span>${fmt(t.d.slice(0, 10))} ${t.d.slice(11, 16)}</span></div>
    <div class="cl"><span>Банк</span><span>${BANKS[t.b] || t.b}</span></div>
    ${k.kind === 'int' || k.kind === 'debt' ? `<div class="card mb" style="margin-top:10px;font-size:13.5px">${k.kind === 'int' ? '🔁' : '🤝'} ${k.why}${k.kind === 'debt' ? '. Не входит в расходы — если это была покупка, выбери другую категорию.' : ''}</div>` : ''}
    <div id="fform" style="margin-top:12px">
      <label class="fl"><span>Категория</span><select id="fcat">${Object.entries(FCATS).map(([c, [e, l]]) => `<option value="${c}" ${c === k.cat ? 'selected' : ''}>${e} ${l}</option>`).join('')}</select></label>
      <label class="frem"><input type="checkbox" id="frem" checked> Запомнить для всех «${esc(t.s)}»</label>
      <button class="btn primary" onclick="finSaveOp('${t.id}')">Сохранить</button>
      <button class="btn ghost" style="margin-top:8px" onclick="finToggleInt('${t.id}')">${k.kind === 'int' ? '➕ Учитывать в расходах/доходах' : '🔁 Не учитывать (перевод между своими)'}</button>
    </div>`);
}
function finSaveOp(id) {
  const t = S.fin.tx.find(x => x.id === id), cat = document.getElementById('fcat').value, rem = document.getElementById('frem').checked;
  if (rem) { const m = fnorm(t.s); S.fin.rules = S.fin.rules.filter(r => r.m !== m).concat({ m, cat, s: t.s }); S.fin.tx.forEach(x => { if (fnorm(x.s) === m) delete x.cat; }); }
  else t.cat = cat;
  closeSheet(); save(); render(); hap('medium'); toast(rem ? 'Правило сохранено' : 'Сохранено');
}
function finToggleInt(id) {
  const t = S.fin.tx.find(x => x.id === id), k = fcls(t);
  if (k.kind === 'int') t.ig = 'exp'; else t.ig = 'int';
  closeSheet(); save(); render(); hap();
}
function finSettings() {
  const cs = [...new Set(S.fin.tx.map(t => t.c).filter(c => c !== 'HUF'))];
  openSheet(`<h3>Финансы — настройки</h3>
    <div id="fform">${cs.length ? `<div class="h3" style="margin-top:0">Курсы валют</div><div class="cgrid">${cs.map(c => `<label class="cf"><span>1 ${c} =</span><div class="cin"><input inputmode="decimal" name="${c}" value="${S.fin.rates[c] || ''}"><em>Ft</em></div></label>`).join('')}</div>
      <p class="hint mb">Курс обновляется сам по обменам валют в выписке Revolut.</p>
      <button class="btn primary mb" onclick="finSaveRates()">Сохранить курсы</button>` : ''}</div>
    <div class="h3">Мои правила (${S.fin.rules.length})</div>
    ${S.fin.rules.map((r, i) => `<div class="ing"><span>${esc(r.s || r.m)} → ${FCATS[r.cat][0]} ${FCATS[r.cat][1]}</span><button class="trash" onclick="S.fin.rules.splice(${i},1);save();finSettings();render()">${I.trash}</button></div>`).join('') || '<p class="hint">Пока нет. Нажми на операцию → выбери категорию → «Запомнить».</p>'}
    <div class="h3">Данные</div>
    <p class="hint mb">Операций: ${S.fin.tx.length}. Хранятся у тебя и в твоём облаке Telegram — другие пользователи их не видят.</p>
    <button class="btn ghost" style="color:var(--red)" onclick="finWipe()">Удалить все финансовые данные</button>`);
}
function finSaveRates() { document.querySelectorAll('#fform input[name]').forEach(i => { const v = num(i.value); if (v > 0) S.fin.rates[i.name] = v; }); closeSheet(); save(); render(); toast('Курсы сохранены'); }
let wipeArm = 0;
function finWipe() { if (Date.now() - wipeArm > 4000) { wipeArm = Date.now(); return toast('Нажми ещё раз, чтобы удалить'); } S.fin = FIN_DEF(); pairCache.key = ''; closeSheet(); save(); render(); toast('Финансовые данные удалены'); }



/* ===================== SHEETS ===================== */
const sheetEl = () => document.getElementById('sheet');
// Пока открыто окно, страница под ним заморожена (иначе она прокручивается вместе с окном)
let lockY = 0;
function lockScroll() {
  const b = document.body; if (b.classList.contains('locked')) return;
  lockY = window.scrollY; b.style.top = -lockY + 'px'; b.classList.add('locked');
  try { tg.disableVerticalSwipes(); } catch (e) {} // свайп вниз не сворачивает мини-апп
}
function unlockScroll() {
  const b = document.body; if (!b.classList.contains('locked')) return;
  b.classList.remove('locked'); b.style.top = ''; window.scrollTo(0, lockY);
  try { tg.enableVerticalSwipes(); } catch (e) {}
}
// Просмотр фото на весь экран
const lbOpen = () => document.getElementById('lb').classList.contains('show');
let lbLocked = false, lbTap = 0;
function zoomImg(el) {
  const box = document.getElementById('lbin');
  box.innerHTML = `<img src="${esc(el.currentSrc || el.src)}" alt="" referrerpolicy="no-referrer">`;
  const im = box.firstChild;
  im.onclick = e => { e.stopPropagation(); const n = Date.now(); if (n - lbTap < 320) { im.classList.toggle('z'); if (im.classList.contains('z')) { const r = box.getBoundingClientRect(); box.scrollLeft = (box.scrollWidth - r.width) / 2; box.scrollTop = (box.scrollHeight - r.height) / 2; } } lbTap = n; };
  lbLocked = !document.body.classList.contains('locked'); if (lbLocked) lockScroll();
  document.getElementById('lb').classList.add('show'); hap();
  try { tg.BackButton.show(); } catch (e) {}
}
function zoomClose() {
  document.getElementById('lb').classList.remove('show');
  if (lbLocked && !document.getElementById('sheetwrap').classList.contains('show')) unlockScroll();
  lbLocked = false;
  try { stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
function openSheet(html) { const sh = sheetEl(); sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0; lockScroll(); document.getElementById('sheetwrap').classList.add('show'); }
function closeSheet() { const w = document.getElementById('sheetwrap'); if (!w.classList.contains('show')) return; w.classList.remove('show'); unlockScroll(); }
document.addEventListener('touchmove', e => { if (document.body.classList.contains('locked') && !e.target.closest('#sheet')) e.preventDefault(); }, { passive: false });
let formCb = null;
function openForm(o) {
  formCb = o.onSave; const v = o.values || {};
  formFields = o.fields;
  openSheet(`<h3>${o.title}</h3><div id="fform">${o.fields.map(f => {
    const val = v[f.key] ?? '';
    if (f.type === 'photo') return `<div class="fl"><span>${f.label || 'Фото'}</span><div class="ph-field">
      <div class="ph-prev" id="phprev">${photoSrc(val) ? `<img src="${esc(photoSrc(val))}" alt="">` : I.camera}</div>
      <div class="ph-btns"><label class="ph-btn">${val ? 'Заменить фото' : 'Добавить фото'}<input type="file" accept="image/*" onchange="pickPhoto(this)"></label>
      <button type="button" class="ph-btn del" onclick="clearPhoto()">Убрать фото</button></div></div>
      <input type="hidden" name="${f.key}" id="phval" value="${esc(val)}"></div>`;
    if (f.type === 'link') return `<div class="fl"><span>${f.label}</span><div class="lnk"><input name="${f.key}" type="url" inputmode="url" value="${esc(val)}" placeholder="https://… (вставь ссылку)"><button type="button" class="ph-btn" onclick="linkFetch(this,'${f.mode || ''}')">⤓ Подтянуть</button></div>
      <input type="hidden" name="img" value="${esc(v.img || '')}"><img class="lnkimg" id="lnkimg" src="${esc(v.img || '')}" alt="" referrerpolicy="no-referrer" ${v.img ? '' : 'hidden'} onclick="zoomImg(this)"></div>`;
    if (f.type === 'textarea') return `<label class="fl"><span>${f.label}</span><textarea name="${f.key}" rows="5" placeholder="${f.ph || ''}">${esc(val)}</textarea></label>`;
    if (f.type === 'select') return `<label class="fl"><span>${f.label}</span><select name="${f.key}">${f.options.map(x => `<option ${x == val ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
    return `<label class="fl"><span>${f.label}</span><input name="${f.key}" type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(val)}" placeholder="${f.ph || ''}" ${f.req ? 'required' : ''}></label>`;
  }).join('')}<button class="btn primary" type="button" style="margin-top:6px" onclick="submitForm()">Сохранить</button></div>`);
}
let formFields = [];
// Фото сжимается до 480px по длинной стороне (JPEG), чтобы влезало в память
function pickPhoto(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const M = 480, s = Math.min(1, M / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const d = c.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
    document.getElementById('phval').value = d;
    document.getElementById('phprev').innerHTML = `<img src="${d}" alt="">`;
    hap();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не удалось открыть фото'); };
  img.src = url;
}
function clearPhoto() { document.getElementById('phval').value = ''; document.getElementById('phprev').innerHTML = I.camera; hap(); }
// Без <form>/submit: в песочницах (превью, некоторые webview) отправка формы блокируется
function submitForm() {
  const box = document.getElementById('fform'), v = {};
  box.querySelectorAll('input[name], select[name], textarea[name]').forEach(el => { v[el.name] = el.value.trim(); });
  const miss = formFields.find(f => f.req && !v[f.key]);
  if (miss) { toast('Заполни: ' + miss.label); const el = box.querySelector(`[name="${miss.key}"]`); el && el.focus(); hap('rigid'); return; }
  formCb(v); save(); closeSheet(); render(); hap('medium');
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('#fform') && e.target.tagName === 'INPUT') { e.preventDefault(); submitForm(); } });
let acts = [];
function openActions(title, list, extra = '') { acts = list; openSheet(`<h3>${esc(title)}</h3>${extra}${list.map((a, i) => `<button class="act ${a.danger ? 'danger' : ''}" onclick="runAct(${i})">${a.label}</button>`).join('')}<button class="act" style="text-align:center;color:var(--muted)" onclick="closeSheet()">Отмена</button>`); }
function runAct(i) { const a = acts[i]; if (!a.keep) closeSheet(); a.fn(); hap(); if (!a.keep && !a.nosave) save(); if (!a.keep) render(); }
function delItem(col, id) { S[col] = S[col].filter(x => x.id !== id); save(); closeSheet(); render(); toast('Удалено'); }
function setUI(k, v) { hap(); S.ui[k] = v; save(false); render(); }
function openLink(u) { try { tg.openLink(u); } catch (e) { window.open(u, '_blank'); } }
function settings() {
  const who = TG_USER ? `${esc(TG_USER.first_name || '')} · ID <b>${TG_USER.id}</b>` : 'Открыто вне Telegram';
  const t = lastSync ? new Date(lastSync).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) : '';
  const info = `<div class="card mb setinfo"><div>👤 ${who}</div>
    <div>${CLOUD ? `☁️ Облако Telegram: занято ${cloudKeys.size} из 1024 ячеек` : '📱 Данные хранятся только на этом устройстве'}</div>
    ${t ? `<div class="muted">Последняя синхронизация: ${t}</div>` : ''}
    <div class="muted" style="margin-top:6px">🔒 Данные привязаны к твоему Telegram-аккаунту. Другие пользователи бота их не видят — у каждого своё хранилище.</div></div>`;
  const list = [];
  if (CLOUD) list.push({ label: 'Синхронизировать сейчас', nosave: 1, fn: () => { flushPush(); queue(pull); } });
  if (TG_USER) list.push({ label: 'Скопировать мой Telegram ID', nosave: 1, fn: () => { navigator.clipboard?.writeText(String(TG_USER.id)).then(() => toast('ID скопирован'), () => toast('ID: ' + TG_USER.id)); } });
  list.push({ label: 'Экспорт данных (скопировать JSON)', nosave: 1, fn: () => { const d = {}; DATA_KEYS.forEach(k => d[k] = S[k]); navigator.clipboard?.writeText(JSON.stringify(d)).then(() => toast('Скопировано'), () => toast('Не удалось скопировать')); } });
  list.push({ label: CLOUD ? 'Сбросить к демо-данным (на всех устройствах)' : 'Сбросить к демо-данным', danger: 1, fn: () => { const ui = S.ui; S = seed(); S.ui = ui; toast('Данные сброшены'); } });
  openActions('Настройки', list, info);
}
